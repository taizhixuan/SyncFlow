<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta name="theme-color" content="#0E0E12" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="SyncFlow" />
    <!-- Apply the theme before first paint so dark-mode users never see a light
         flash. Mirrors lib/ui-preferences.ts (key "syncflow:theme"; OS preference
         when unset); ThemeProvider takes over once React mounts. -->
    <script data-theme-boot>
      (function () {
        var dark = false;
        try {
          var saved = localStorage.getItem('syncflow:theme');
          dark =
            saved === 'dark' ||
            (saved !== 'light' &&
              !!window.matchMedia &&
              window.matchMedia('(prefers-color-scheme: dark)').matches);
        } catch (e) {
          // Storage can be blocked (private mode); fall back to light.
        }
        document.documentElement.classList.toggle('dark', dark);
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', dark ? '#0E0E12' : '#FFFFFF');
      })();
    </script>
    <title>SyncFlow: real-time collaborative whiteboard</title>
    <meta
      name="description"
      content="A real-time collaborative whiteboard. Live cursors, conflict-free editing, even offline."
    />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
