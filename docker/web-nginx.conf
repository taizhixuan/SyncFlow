server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Docker's embedded DNS. Required because nginx resolves a literal upstream
  # name once at startup and caches the IP forever — so recreating the api
  # container (new IP) would leave this proxying to a dead address until nginx
  # itself restarted.
  resolver 127.0.0.11 valid=10s ipv6=off;

  # Proxy API + WebSocket traffic to the api service. The upstream goes through
  # a variable on purpose: that defers resolution to request time, so it picks
  # up the api's new IP instead of the one cached at boot.
  location /api/ {
    set $api_upstream http://api:3000;
    proxy_pass $api_upstream;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # SPA fallback.
  location / {
    try_files $uri $uri/ /index.html;
  }
}
